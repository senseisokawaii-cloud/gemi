<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const VERSION = 'v7';
const PUSH_TS = 0.8;           // itme animasyonu hızı (yavaş, ağır)
const SPEED = 0.465 * PUSH_TS; // m/s, ayakların yere bastığı hız
const KEYWORD = 'fatih';

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9c9a3);
scene.fog = new THREE.Fog(0xd9c9a3, 24, 55);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const CAM_BASE = new THREE.Vector3(0, 9.5, 13.5);
const LOOK_BASE = new THREE.Vector3(0, 0.3, -2.2);
camera.position.copy(CAM_BASE);

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a7a55, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d6, 1.6);
sun.position.set(-8, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-16,right:16,top:16,bottom:-16,near:1,far:50});
sun.shadow.bias = -0.0005;
scene.add(sun);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 42 : 30;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const flat = c => new THREE.MeshLambertMaterial({color:c, flatShading:true});

// ---------- ground ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), flat(0xcdb98c));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const path = new THREE.Mesh(new THREE.PlaneGeometry(9, 200), flat(0xb89e70));
path.rotation.x = -Math.PI/2; path.position.y = 0.01; path.receiveShadow = true; scene.add(path);
for (const s of [-1, 1]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(60, 200), flat(0x9aa465));
  g.rotation.x = -Math.PI/2; g.position.set(s*(11+30), 0.005, 0); g.receiveShadow = true; scene.add(g);
}
// uzak tepeler
for (let i = 0; i < 9; i++) {
  const r = 6 + Math.random()*6;
  const hill = new THREE.Mesh(new THREE.ConeGeometry(r, 3 + Math.random()*3, 7), flat(0x8e9a5c));
  hill.position.set(-40 + i*10 + Math.random()*4, 0, -48 - Math.random()*6);
  scene.add(hill);
}

// ---------- kayan dekor (dünya akıyor, kafile yerinde) ----------
const scrollers = [];          // {obj, span}
const SPAN = 64, ZMIN = -40;
function addScroller(obj, z){ obj.position.z = z; scene.add(obj); scrollers.push(obj); }

// kızaklar (yağlanmış kütükler)
const logGeo = new THREE.CylinderGeometry(0.18, 0.18, 3.4, 7);
logGeo.rotateZ(Math.PI/2);
const logMat = flat(0x7a5232);
for (let z = ZMIN; z < ZMIN + SPAN; z += 1.6) {
  const l = new THREE.Mesh(logGeo, logMat);
  l.position.y = 0.18; l.castShadow = true; l.receiveShadow = true;
  addScroller(l, z);
}
// yerdeki taşlar / izler
const stoneMat = flat(0x9c8763);
for (let i = 0; i < 140; i++) {
  const s = new THREE.Mesh(new THREE.DodecahedronGeometry(0.08 + Math.random()*0.18, 0), stoneMat);
  s.position.set((Math.random()-.5)*20, 0.03, 0); s.scale.y = 0.5;
  addScroller(s, ZMIN + Math.random()*SPAN);
}
// selviler, çadırlar, kayalar
const cyprMat = flat(0x4f6b38), trunkMat = flat(0x6b4a2e);
function cypress(){
  const g = new THREE.Group();
  const h = 3.5 + Math.random()*2.5;
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.7, h, 6), cyprMat);
  c.position.y = h/2 + 0.4; c.castShadow = true; g.add(c);
  const t = new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.6,5), trunkMat); t.position.y=.3; g.add(t);
  return g;
}
const tentMats = [flat(0xe9dcc0), flat(0xc9b38a), flat(0xb5543c)];
function tent(){
  const g = new THREE.Group();
  const m = tentMats[Math.floor(Math.random()*tentMats.length)];
  const r = 1.4 + Math.random()*0.8;
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1.3, 10), m); body.position.y=.65; body.castShadow=true; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(r*1.08, 1.4, 10), m); roof.position.y=2; roof.castShadow=true; g.add(roof);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.6,4), trunkMat); pole.position.y=2.9; g.add(pole);
  return g;
}
const rockMat = flat(0x8d8068);
function rock(){ const r = new THREE.Mesh(new THREE.DodecahedronGeometry(.4+Math.random()*.7,0), rockMat); r.position.y=.25; r.castShadow=true; return r; }
for (let z = ZMIN; z < ZMIN + SPAN; z += 2.2) {
  for (const s of [-1, 1]) {
    const k = Math.random();
    const o = k < .45 ? cypress() : k < .7 ? tent() : rock();
    o.position.x = s*(8.5 + Math.random()*9);
    o.rotation.y = Math.random()*6.28;
    addScroller(o, z + Math.random()*1.5);
  }
}

// ---------- gemi (kadırga) ----------
const SHIP_LEN = 9, SHIP_W = 1.15;
const BAR_Z = [-3.0, -1.5, 0, 1.5];   // tahtaların gövdedeki yeri
const BAR_LEN = 1.7, BAR_Y = 0.85;     // dünya yüksekliği (itme animasyonunda el hizası)
const HAND_REACH = 0.41;               // karakter kökünden ellerine mesafe (ölçüldü)
const WALK_TS = 0.5;                   // arkadakilerin yürüyüş hızı
function hullHalfWidth(z){            // z: -L/2 (kıç) .. +L/2 (baş)
  const t = (z + SHIP_LEN/2) / SHIP_LEN;   // 0 kıç, 1 baş
  if (t > 0.72) return SHIP_W * Math.max(0.05, 1 - (t - 0.72)/0.28) ** 0.8;
  if (t < 0.12) return SHIP_W * (0.55 + 0.45 * t/0.12);
  return SHIP_W;
}
function buildShip(){
  const g = new THREE.Group();
  const N = 22, pos = [], idx = [];
  const H = 0.9, bottomW = 0.45;
  for (let i = 0; i <= N; i++) {
    const z = -SHIP_LEN/2 + SHIP_LEN * i / N;
    const w = hullHalfWidth(z);
    const sheer = 0.25 * ((i/N - .5) * 2) ** 2;           // uçlara doğru kalkık
    const top = H + sheer + (i === N ? 0.35 : 0);
    // 0 sol üst, 1 sol alt, 2 sağ alt, 3 sağ üst
    pos.push(-w, top, z,  -w*bottomW, 0, z,  w*bottomW, 0, z,  w, top, z);
  }
  for (let i = 0; i < N; i++) {
    const a = i*4, b = (i+1)*4;
    for (let k = 0; k < 3; k++) idx.push(a+k, b+k, a+k+1,  a+k+1, b+k, b+k+1);
  }
  // kıç kapağı
  idx.push(0,1,2, 0,2,3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx); geo.computeVertexNormals();
  const hull = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color:0x6e4326, flatShading:true, side:THREE.DoubleSide}));
  hull.castShadow = true; hull.receiveShadow = true; g.add(hull);
  // güverte
  const deckShape = new THREE.Shape();
  for (let i = 0; i <= N; i++) { const z = -SHIP_LEN/2 + SHIP_LEN*i/N; const w = hullHalfWidth(z)*0.97; i ? deckShape.lineTo(w, z) : deckShape.moveTo(w, z); }
  for (let i = N; i >= 0; i--) { const z = -SHIP_LEN/2 + SHIP_LEN*i/N; deckShape.lineTo(-hullHalfWidth(z)*0.97, z); }
  const deck = new THREE.Mesh(new THREE.ShapeGeometry(deckShape), flat(0xa77a4c));
  deck.rotation.x = Math.PI/2; deck.position.y = 0.75; deck.receiveShadow = true; g.add(deck);
  // kırmızı bant
  for (const s of [-1, 1]) {
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.16, SHIP_LEN*0.62), flat(0x9e2b22));
    band.position.set(s*(SHIP_W+0.005), 0.72, -0.3); g.add(band);
  }
  // direk + seren + sarılı yelken
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,5,7), flat(0x6b4426));
  mast.position.set(0, 3.2, 0.5); mast.castShadow = true; g.add(mast);
  const yard = new THREE.Group(); yard.position.set(0, 5.2, 0.5); yard.rotation.x = 0.55; g.add(yard);
  const yb = new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,6,6), flat(0x6b4426)); yard.add(yb);
  const furl = new THREE.Mesh(new THREE.CylinderGeometry(.15,.1,5,7), flat(0xefe4cc)); furl.position.z = 0.12; furl.castShadow = true; yard.add(furl);
  // itme kolları (gövdeden yana çıkan tahtalar)
  const barMat = flat(0x8a5c34);
  for (const s of [-1, 1]) for (const z of BAR_Z) {
    const w = hullHalfWidth(z);
    const bar = new THREE.Mesh(new THREE.BoxGeometry(BAR_LEN + 0.3, 0.1, 0.12), barMat);
    bar.position.set(s*(w + BAR_LEN/2 - 0.15), BAR_Y - 0.34, z);
    bar.castShadow = true; g.add(bar);
  }
  // baş süsü
  const bow = new THREE.Mesh(new THREE.ConeGeometry(.12, 1.4, 5), flat(0x6e4326));
  bow.position.set(0, 1.45, SHIP_LEN/2 + 0.3); bow.rotation.x = 1.05; g.add(bow);
  return g;
}
const ship = buildShip();
ship.position.y = 0.34;
scene.add(ship);

// ---------- kafile yerleşimi ----------
// 'bar' = tahtayı iten ön saf (hediye atanlar), 'rear' = arkadan yürüyen (yorum yazanlar)
const slots = [];
function slot(x, z, type, jit = .1){ slots.push({x: x + (Math.random()-.5)*jit, z: z + (Math.random()-.5)*jit, type}); }
for (const s of [-1, 1]) for (const z of BAR_Z) {
  const w = hullHalfWidth(z);
  slot(s*(w + 0.55) - 0.03, z - HAND_REACH + 0.0, 'bar', 0);     // tahtanın iç ucu
  slot(s*(w + 1.25) - 0.03, z - HAND_REACH, 'bar', 0);     // tahtanın dış ucu
}
const rearRows = [4, 5, 5, 5, 5];
rearRows.forEach((n, r) => {
  const z = -SHIP_LEN/2 - 1.2 - r*0.95;
  for (let i = 0; i < n; i++) slot((i - (n-1)/2) * 0.85 + (r%2)*0.2, z, 'rear');
});
/* */
const barSlots = slots.map((s,i)=>i).filter(i=>slots[i].type==='bar').sort((a,b)=>slots[b].z-slots[a].z);   // öndeki tahtalar önce dolsun
const rearSlots = slots.map((s,i)=>i).filter(i=>slots[i].type==='rear');   // öndeki sıradan arkaya

// ---------- karakterler ----------
const labelsEl = document.getElementById('labels');
const loader = new GLTFLoader();
const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));

let clips = {};
let templates = [];
const crowd = [];          // her slot için bir karakter
const byUser = new Map();  // uniqueId -> karakter

function prepClips(gltf){
  const all = Object.fromEntries(gltf.animations.map(a => [a.name, a]));
  const push = THREE.AnimationUtils.subclip(all['Push_and_Walk_Forward'], 'push', 63, 164, 30);
  const walk = all['Walking'].clone();
  for (const c of [push, walk]) {
    for (const tr of c.tracks) {
      if (/Hips\.position$/.test(tr.name)) {            // kök hareketini sil, yerinde yürüsün
        const v = tr.values;
        for (let i = 0; i < v.length; i += 3) v[i+2] = 0;   // kalça tam kökün üstünde
      }
    }
  }
  return {push, walk, idle: all['Idle']};
}

function makeChar(i){
  const s = slots[i];
  const tpl = templates[Math.floor(Math.random()*templates.length)];
  const obj = SkeletonUtils.clone(tpl);
  obj.position.set(s.x, 0, s.z);
  obj.rotation.y = 0;
  const sc = 1;
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  obj.visible = false;
  scene.add(obj);
  const mixer = new THREE.AnimationMixer(obj);
  const push = mixer.clipAction(clips.push), walk = mixer.clipAction(clips.walk);
  push.timeScale = PUSH_TS; walk.timeScale = WALK_TS;
  push.play(); walk.play();
  push.time = Math.random() * clips.push.duration; walk.time = Math.random() * clips.walk.duration;
  const label = document.createElement('div');
  label.className = 'lb'; label.style.display = 'none';
  labelsEl.appendChild(label);
  const c = {slot: i, obj, mixer, push, walk, label, user: null, name: '', last: 0, h: 1.75*sc};
  setMode(c, s.type);
  return c;
}
function setMode(c, type){
  const bar = type === 'bar';
  c.push.setEffectiveWeight(bar ? 1 : 0); c.walk.setEffectiveWeight(bar ? 0 : 1);
  c.walk.timeScale = type === 'walking' ? 0.75 : WALK_TS;
}

// ---------- katılım / hediye ----------
function normalize(t){ return (t || '').toLocaleLowerCase('tr').replace(/ı/g,'i'); }
const MOVE_SPEED = 1.15;           // yürüyerek gelirken (m/s)
const LANE_X = 3.5;                // tahtaların dışından geçen yürüme yolu
const isBar = i => i != null && slots[i].type === 'bar';

// karakteri bir yerden ötekine yürüt (tahtacıların arasından değil, dıştan dolaşarak)
function walkTo(c, i){
  const from = c.slot, cur = c.obj.position, t = slots[i];
  c.slot = i; crowd[i] = c;
  const path = [];
  const side = Math.sign(isBar(i) ? t.x : (isBar(from) ? slots[from].x : (cur.x || t.x))) || 1;
  if (from != null && isBar(from)) path.push({x: cur.x, z: cur.z - 0.55});          // tahtadan geri çekil
  if (isBar(i) || (from != null && isBar(from))) {
    path.push({x: side*LANE_X, z: (path.length ? path[path.length-1].z : cur.z)});
    path.push({x: side*LANE_X, z: t.z - 0.55});
    path.push({x: t.x, z: t.z - 0.55});
  }
  path.push({x: t.x, z: t.z});
  c.path = path; c.moving = true; setMode(c, 'walking');
}
// sahneye dışarıdan yürüyerek gir
function spawnTo(c, i){
  const t = slots[i];
  const side = Math.sign(t.x) || (Math.random() < .5 ? -1 : 1);
  c.obj.position.set(side*(LANE_X + 4), 0, t.z - 2.5);
  c.obj.visible = true;
  c.slot = null;
  walkTo(c, i);
}
function updateMovers(dt){
  for (const c of crowd) {
    if (!c.moving) continue;
    const o = c.obj.position, wp = c.path[0];
    const dx = wp.x - o.x, dz = wp.z - o.z, d = Math.hypot(dx, dz), step = MOVE_SPEED*dt;
    if (d <= step) { o.x = wp.x; o.z = wp.z; c.path.shift(); }
    else { o.x += dx/d*step; o.z += dz/d*step; }
    const want = d > 0.01 ? Math.atan2(dx, dz) : 0;
    let diff = want - c.obj.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    c.obj.rotation.y += diff * Math.min(1, dt*8);
    if (!c.path.length) { c.moving = false; c.turnBack = true; setMode(c, slots[c.slot].type); }
  }
  for (const c of crowd) if (c.turnBack) {                 // yerine varınca öne dön
    c.obj.rotation.y *= Math.max(0, 1 - dt*6);
    if (Math.abs(c.obj.rotation.y) < 0.01) { c.obj.rotation.y = 0; c.turnBack = false; }
  }
}

function setUser(c, uid, name){
  c.user = uid; c.name = name || uid; c.last = performance.now(); c.giftAt = 0;
  c.label.textContent = c.name; byUser.set(uid, c);
}

// yorum: arkadaki kafileye yürüyerek katıl
function joinRear(uid, name){
  let c = byUser.get(uid);
  if (c) { c.last = performance.now(); return c; }
  let target = rearSlots.map(i => crowd[i]).find(ch => !ch.user);
  if (!target) {                                  // dolu: en uzun süredir sessiz olan gider
    for (const i of rearSlots) { const ch = crowd[i]; if (ch === cz.char || ch.moving) continue; if (!target || ch.last < target.last) target = ch; }
    if (!target) return null;
    byUser.delete(target.user);
  }
  setUser(target, uid, name);
  spawnTo(target, target.slot);
  return target;
}

// hediye (Rosa/Kalp ve üstü): yürüyerek ön safa geç, tahtayı it
function toFront(uid, name){
  const c = joinRear(uid, name);
  if (!c) return;
  c.giftAt = performance.now();
  if (isBar(c.slot)) return;
  let spot = barSlots.map(i => crowd[i]).find(ch => !ch.user);
  if (!spot) for (const i of barSlots) { const ch = crowd[i]; if (ch === cz.char || ch.moving) continue; if (!spot || (ch.giftAt||0) < (spot.giftAt||0)) spot = ch; }
  if (!spot) return;
  const from = c.slot, to = spot.slot;
  if (spot.user) walkTo(spot, from);              // tahtadaki en eski hediyeci arkaya yürür
  else { spot.slot = from; crowd[from] = spot; spot.obj.position.set(slots[from].x, 0, slots[from].z); }
  walkTo(c, to);
}

// karşılık hemen gelmesin, biraz gecikmeli
const later = (fn, a, b) => setTimeout(fn, (a + Math.random()*(b - a)) * 1000);
function onChat(uid, name, text){
  const c = byUser.get(uid);
  if (c) { c.last = performance.now(); return; }
  if (normalize(text).includes(KEYWORD)) later(() => joinRear(uid, name), 1.5, 3.5);
}

// öne geçiren hediyeler: Parmak Kalp (Finger Heart, 5) ve Nazar (Evil Eye, 5); 5 jeton ve üstü her hediye de geçirir
const FRONT_GIFTS = ['finger heart', 'parmak kalp', 'evil eye', 'nazar', 'nazar boncuğu'];
function onGift(uid, name, giftName, coins){
  const g = (giftName || '').toLocaleLowerCase('tr');
  if (FRONT_GIFTS.includes(g) || coins >= 5) later(() => toFront(uid, name), 2.5, 5);
}

// ---------- TikFinity ----------
function connect(){
  let ws;
  try { ws = new WebSocket('ws://localhost:21213/'); } catch(e) { return setTimeout(connect, 3000); }
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(e) { return; }
    const d = m.data || {};
    const uid = d.uniqueId || d.userId; const name = d.nickname || d.uniqueId;
    if (!uid) return;
    if (m.event === 'chat') onChat(uid, name, d.comment);
    else if (m.event === 'gift') {
      if (d.giftType === 1 && !d.repeatEnd) return;   // seri hediyede sadece sonunda bir kez
      onGift(uid, name, d.giftName, d.diamondCount || 0);
    }
  };
  ws.onclose = () => setTimeout(connect, 3000);
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}

// ---------- deneme ----------
const fake = ['ahmet_34','zeynep.k','Mert Göktürk','yunus.demir','ARDA','Simge💘','kayra','Nazlı','ibrahim paşa','ezgi','hadra','melike','Salih','Asmın','Lampoe','Yeşil💚','berkayagan','dilara','osman_61','sinan'];
let fakeN = 0;
function fakeUser(){ const n = fake[fakeN % fake.length] + (fakeN >= fake.length ? ' ' + Math.floor(fakeN/fake.length) : ''); fakeN++; return n; }
if (location.hash === '#deneme') {
  const t = document.getElementById('test'); t.style.display = 'flex';
  t.addEventListener('click', e => {
    const k = e.target.dataset.t; if (!k) return;
    if (k === 'g') {
      const users = [...byUser.keys()];
      if (users.length && Math.random() < .7) { const u = users[Math.floor(Math.random()*users.length)]; onGift(u, byUser.get(u).name, 'Finger Heart', 5); }
      else { const n = fakeUser(); onGift(n, n, 'Evil Eye', 5); }
    } else for (let i = 0; i < +k; i++) { const n = fakeUser(); onChat(n, n, 'Fatih'); }
  });
}

// ---------- kamera ----------
// genel çekim + 5-10 sn'de bir rastgele birine yakın çekim (bir tahtacı, bir arka ahali); sadece o kişinin adı görünür
const ease = t => t < .5 ? 2*t*t : 1 - (-2*t+2)**2/2;
const cz = {char: null, next: 6, t: 0, phase: 'idle', pickBar: false};
const cP = new THREE.Vector3(), zP = new THREE.Vector3(), zL = new THREE.Vector3(), lk = new THREE.Vector3();
function pickZoom(){
  const bars = barSlots.map(i => crowd[i]).filter(c => c.user && !c.moving);
  const rear = rearSlots.map(i => crowd[i]).filter(c => c.user && !c.moving);
  cz.pickBar = !cz.pickBar;
  const pool = (cz.pickBar && bars.length) || !rear.length ? bars : rear;
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}
function updateCamera(dt, time){
  cP.set(CAM_BASE.x + Math.sin(time*0.11)*1.0, CAM_BASE.y + Math.sin(time*0.07)*0.25, CAM_BASE.z);
  let k = 0;
  if (cz.phase === 'idle') {
    if (time > cz.next) {
      cz.char = pickZoom();
      if (cz.char) { cz.phase = 'in'; cz.t = 0; cz.char.label.classList.add('big'); }
      else cz.next = time + 3;
    }
  } else {
    cz.t += dt;
    if (cz.phase === 'in')        { k = ease(Math.min(1, cz.t/0.9)); if (cz.t >= 0.9) { cz.phase = 'hold'; cz.t = 0; } }
    else if (cz.phase === 'hold') { k = 1; if (cz.t >= 2.8) { cz.phase = 'out'; cz.t = 0; cz.char.label.classList.remove('big'); } }
    else { k = 1 - ease(Math.min(1, cz.t/0.9)); if (cz.t >= 0.9) { cz.phase = 'idle'; cz.char = null; cz.next = time + 2 + Math.random()*4; } }
  }
  if (cz.char && k > 0) {
    const o = cz.char.obj.position;
    const sx = Math.sign(o.x) || (Math.random() < .5 ? -1 : 1);
    const onBar = slots[cz.char.slot].type === 'bar';
    if (onBar) { zL.set(o.x, 0.95, o.z + 0.3); zP.set(o.x + sx*2.4, 1.9, o.z + 2.7); }
    else       { zL.set(o.x, 2.05, o.z + 0.15); zP.set(sx*(Math.abs(o.x) + 3.6), 2.35, o.z + 0.7); }   // arka ahali: tam yandan, yürürken
    camera.position.lerpVectors(cP, zP, k);
    camera.lookAt(lk.lerpVectors(LOOK_BASE, zL, k));
  } else {
    camera.position.copy(cP); camera.lookAt(LOOK_BASE);
  }
}

// ---------- etiketler ----------
const proj = new THREE.Vector3();
function updateLabels(){
  const w = innerWidth, h = innerHeight;
  for (const c of crowd) {
    const show = c === cz.char && (cz.phase === 'in' || cz.phase === 'hold');
    c.label.style.display = show ? '' : 'none';
    if (!show) continue;
    proj.set(c.obj.position.x, (!c.moving && slots[c.slot].type === 'bar') ? 1.42 : c.h + 0.12, c.obj.position.z).project(camera);
    if (proj.z > 1) { c.label.style.visibility = 'hidden'; continue; }
    c.label.style.visibility = '';
    c.label.style.transform = `translate(${(proj.x*.5+.5)*w}px, ${(-proj.y*.5+.5)*h}px) translate(-50%,-100%)`;
  }
}

// ---------- döngü ----------
const clock = new THREE.Clock();
let time = 0, realTime = 0;
function tick(){
  const rawDt = clock.getDelta(); const dt = Math.min(rawDt, 0.05); time += dt; realTime += rawDt;
  for (const o of scrollers) { o.position.z -= SPEED * dt; if (o.position.z < ZMIN) o.position.z += SPAN; }
  ship.rotation.z = Math.sin(time*0.9)*0.012;
  ship.position.y = 0.34 + Math.abs(Math.sin(time*SPEED/1.6*Math.PI))*0.03;
  updateMovers(dt);
  for (const c of crowd) if (c.obj.visible) c.mixer.update(dt);
  updateCamera(Math.min(rawDt, 0.2), realTime);
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(tick);
}

// ---------- başlat ----------
(async () => {
  try {
    const [y, a, i] = await Promise.all([load('yeniceri.glb'), load('asker.glb'), load('isci.glb')]);
    clips = prepClips(y);
    templates = [y.scene, a.scene, i.scene];
    for (let k = 0; k < slots.length; k++) crowd.push(makeChar(k));
    document.getElementById('load').remove();
    connect();
    tick();
  } catch (e) {
    document.getElementById('load').textContent = 'Model yüklenemedi: ' + e.message;
    console.error(e);
  }
})();
window.__game = {onChat, onGift, VERSION};
